<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7E4632" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="description" content="Kaarigar — free woodworking training for carpenters. Hindi, English, Punjabi, Haryanvi." />
    <title>Kaarigar</title>
    <script>
      // Apply saved theme + text-size BEFORE first paint (no flash, no hydration mismatch).
      (function () {
        try {
          var t = localStorage.getItem('kaarigar:theme')
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
          var s = localStorage.getItem('kaarigar:text-size')
          if (s === 'large' || s === 'xlarge') document.documentElement.setAttribute('data-text-size', s)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
